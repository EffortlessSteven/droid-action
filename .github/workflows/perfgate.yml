# .github/workflows/perfgate.yml — generated by `perfgate init`
name: Performance Gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  perfgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EffortlessMetrics/perfgate@main
        with:
          config: perfgate.toml
          all: "true"
          require_baseline: "true"
          upload_artifact: "true"
