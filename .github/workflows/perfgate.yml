# .github/workflows/perfgate.yml — generated by `perfgate init`
name: Performance Gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  perfgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EffortlessMetrics/perfgate@main
        with:
          config: perfgate.toml
          all: "true"
          fail_on_warn: "true"
          require_baseline: "true"
          upload_artifact: "true"

      - name: Emit hosted review stack surfaces
        if: always()
        run: |
          mkdir -p artifacts/perfgate/droid-node-version

          if perfgate review explain --config perfgate.toml --bench droid-node-version >/dev/null 2>&1; then
            REVIEW_CMD="perfgate review explain --config perfgate.toml --bench droid-node-version"
          else
            REVIEW_CMD="perfgate explain --config perfgate.toml --bench droid-node-version"
          fi

          eval "${REVIEW_CMD}" | tee artifacts/perfgate/droid-node-version/review-explain.txt
          eval "${REVIEW_CMD} --json" > artifacts/perfgate/droid-node-version/review-explain.json || true

          perfgate policy review-packet --config perfgate.toml --bench droid-node-version \
            > artifacts/perfgate/droid-node-version/policy-review-packet.txt || true
          perfgate baseline promote --config perfgate.toml --bench droid-node-version --help \
            > artifacts/perfgate/droid-node-version/baseline-promote-help.txt || true
          perfgate policy promote --config perfgate.toml --bench droid-node-version --help \
            > artifacts/perfgate/droid-node-version/policy-promote-help.txt || true
