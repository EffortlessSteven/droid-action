# perfgate.toml — generated by `perfgate init`
#
# Documentation: https://github.com/EffortlessMetrics/perfgate

# Default settings applied to all benchmarks unless overridden.
[defaults]
# Number of measured samples per benchmark run.
repeat = 7
# Warmup iterations excluded from statistics.
warmup = 1
# Maximum allowed regression fraction (0.20 = 20%).
threshold = 0.20
# Warn when regression reaches threshold * warn_factor.
warn_factor = 0.50
# Coefficient of variation that marks a benchmark as noisy.
noise_threshold = 0.10
# What to do when measured noise exceeds noise_threshold.
noise_policy = "warn"
out_dir = "artifacts/perfgate"
baseline_dir = "baselines"

[[bench]]
name = "droid-node-version"
command = ["node", "-e", "console.log(process.version)"]
